name: Custom AI PR Reviewer (Inline API)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  custom-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
      contents: read
    
    steps:
      - name: Run Custom AI Review
        uses: actions/github-script@v6
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          script: |
            // 1. Fetch PR diff
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              mediaType: { format: 'application/vnd.github.v3.diff' }
            });

            let reviewEvent = 'COMMENT';
            let reviewBody = "### 🤖 Custom AI Code Review\n\nCode analyzed successfully.";
            let inlineComments = [];
            let hasIssues = true;

            try {
              // 2. Call Groq AI with specific instructions for inline comments
              const groqResponse = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GROQ_API_KEY}`
                },
                body: JSON.stringify({
                  model: 'llama3-8b-8192',
                  messages: [
                    { role: 'system', content: 'You are an expert code reviewer. Review the GitHub PR diff. Identify critical bugs. Return ONLY a JSON object with "has_critical_issues" (boolean), "summary" (string), and "comments" (array of objects with "path" (filename), "line" (integer line number from the diff), and "body" (review comment for that line)).' },
                    { role: 'user', content: diff }
                  ]
                })
              });
              
              const groqData = await groqResponse.json();
              
              if (groqData.choices && groqData.choices.length > 0) {
                let content = groqData.choices[0].message.content;
                content = content.replace(/```json\n|```/g, '').trim();
                
                try {
                  const review = JSON.parse(content);
                  reviewBody = `### 🤖 Custom AI Code Review\n\n${review.summary || "Review complete."}`;
                  hasIssues = review.has_critical_issues === true;
                  
                  if (review.comments && review.comments.length > 0) {
                    inlineComments = review.comments.map(c => ({
                      path: c.path,
                      line: c.line,
                      body: c.body
                    }));
                  }
                } catch (e) {
                  reviewBody = `### 🤖 Custom AI Code Review\n\n${content}`;
                }
              } else if (groqData.error) {
                  reviewBody = `### 🤖 Custom AI Code Review\n\n**API Error:** ${groqData.error.message}`;
              }
            } catch (error) {
              reviewBody = `### 🤖 Custom AI Code Review\n\nError fetching review: ${error.message}`;
            }

            // 3. Use GitHub Review API for Inline Comments
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: reviewBody,
              event: hasIssues ? 'REQUEST_CHANGES' : 'COMMENT',
              comments: inlineComments
            });

            // 4. Set Status Check (Block Merge if issues found)
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: hasIssues ? 'failure' : 'success',
              description: hasIssues ? 'Critical bugs detected. Merge blocked.' : 'No critical issues. Ready to merge.',
              context: 'Custom AI PR Reviewer'
            });
