name: Custom AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  custom-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
      contents: read
    
    steps:
      - name: Run Custom AI Review
        uses: actions/github-script@v6
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            // 1. Fetch PR diff using GitHub API
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              mediaType: { format: 'application/vnd.github.v3.diff' }
            });

            // 2. Call OpenAI API for Bug Detection
            const openAiResponse = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                messages: [
                  { role: 'system', content: 'You are an expert code reviewer. Review the following GitHub PR diff. Identify critical bugs, security vulnerabilities, and regressions. Return ONLY a JSON object with "has_critical_issues" (boolean true/false) and "review_comment" (markdown string with findings and fix recommendations).' },
                  { role: 'user', content: diff }
                ]
              })
            });
            
            const openAiData = await openAiResponse.json();
            let content = openAiData.choices[0].message.content;
            
            // Clean up response to ensure it's valid JSON
            content = content.replace(/```json\n|```/g, '').trim();
            const review = JSON.parse(content);

            // 3. Post comment on PR using GitHub API
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### 🤖 Custom AI Code Review\n\n${review.review_comment}`
            });

            // 4. Set Quality Gate (Block merge if critical issues found)
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: review.has_critical_issues ? 'failure' : 'success',
              description: review.has_critical_issues ? 'Critical bugs detected. Merge blocked.' : 'No critical issues. Ready to merge.',
              context: 'Custom AI PR Reviewer'
            });
